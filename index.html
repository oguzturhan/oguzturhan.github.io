<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>...</title>
<style>
  :root {
    --bg: #fafafa;
    --text: #1a1a1a;
    --muted: #6b6b6b;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    text-align: center;
    max-width: 420px;
  }
  .card img {
    width: 220px;
    height: 220px;
    object-fit: cover;
    border-radius: 50%;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    margin: 28px 0 8px;
    letter-spacing: -0.01em;
  }
  p {
    color: var(--muted);
    font-size: 0.95rem;
    margin: 0;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="cat.jpg" alt="Yükleniyor">
    <h1>Loading...</h1>
    <p>Hopefully......</p>
  </div>
</body>
</html>
